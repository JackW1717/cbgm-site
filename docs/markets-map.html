<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CBGM priority markets</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:transparent;font-family:'Inter',system-ui,sans-serif}
  #map{width:100%;height:100%}
  svg{display:block;width:100%;height:100%;overflow:visible}
</style>
</head>
<body>
<div id="map"></div>
<script>
const W = 900, H = 470;
const MARKETS = [
  { name: "United States", coords: [-98, 39], active: true },
  { name: "United Kingdom", coords: [-2.2, 54], active: true },
  { name: "Nigeria", coords: [8.3, 9.6], active: true },
  { name: "Ghana", coords: [-1.1, 7.9], active: true }
];
const HIGHLIGHT = new Set(["United States of America", "United Kingdom", "Nigeria", "Ghana"]);

(async () => {
  const topology = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
  const countries = topojson.feature(topology, topology.objects.countries).features;

  const svg = d3.select("#map").append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("preserveAspectRatio", "xMidYMid meet");
  const projection = d3.geoNaturalEarth1().fitExtent([[8, 8], [W - 8, H - 8]], { type: "Sphere" });
  const path = d3.geoPath(projection);

  const g = svg.append("g");
  g.selectAll("path.country").data(countries).join("path")
    .attr("class", "country")
    .attr("d", path)
    .attr("fill", d => HIGHLIGHT.has(d.properties.name) ? "rgba(255,255,255,.22)" : "rgba(255,255,255,.085)")
    .attr("stroke", "rgba(255,255,255,.20)")
    .attr("stroke-width", 0.6);

  const pins = svg.append("g");
  MARKETS.forEach(m => {
    const [x, y] = projection(m.coords);
    const colour = m.active ? "#38B34B" : "#7FD18C";
    pins.append("circle").attr("cx", x).attr("cy", y).attr("r", 13)
      .attr("fill", colour).attr("opacity", m.active ? 0.18 : 0.13);
    pins.append("circle").attr("cx", x).attr("cy", y).attr("r", 4.6)
      .attr("fill", colour).attr("stroke", "#0E2340").attr("stroke-width", 1);
  });
})();
</script>
</body>
</html>
